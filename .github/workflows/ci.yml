# =============================================================================
# nrzube — Continuous Integration Workflow
#
# Triggered on:
#   - Pull requests targeting main
#   - Pushes to main (manual trigger for full build)
#
# Performs:
#   1. Boot gate build (arm64) for validation (default)
#   2. Static verification (file existence, manifest validity)
#   3. Unit tests for the Rust agent (if applicable)
#   4. Optional: Full build via workflow_dispatch
#
# This workflow does NOT sign or publish artifacts.
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'boot-gate'
        type: choice
        options:
          - boot-gate
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Directories
  BUILD_DIR: "build"
  OUT_DIR: "output"
  DIST_DIR: "dist"

jobs:
  build:
    name: Build (${{ inputs.target || 'boot-gate' }})
    runs-on: ubuntu-24.04-arm
    
    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------------------
      # 2. Install system dependencies
      # -------------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            build-essential \
            curl \
            fakeroot \
            genimage \
            mtools \
            python3 \
            squashfs-tools \
            u-boot-tools \
            util-linux

      # -------------------------------------------------------------------------
      # 3. Set environment
      # -------------------------------------------------------------------------
      - name: Set environment
        run: |
          mkdir -p ${{ env.BUILD_DIR }}/buildroot
          mkdir -p ${{ env.OUT_DIR }}
          mkdir -p ${{ env.DIST_DIR }}

      # -------------------------------------------------------------------------
      # 4. Build
      # -------------------------------------------------------------------------
      - name: Build nrzube
        id: build
        run: |
          REPO_DIR="$(pwd)"
          BR2_DIR="$REPO_DIR/${{ env.BUILD_DIR }}/buildroot"
          OUT_DIR="$REPO_DIR/${{ env.OUT_DIR }}"
          DIST_DIR="$REPO_DIR/${{ env.DIST_DIR }}"
          SRC_DIR="$REPO_DIR/${{ env.BUILD_DIR }}/src"
          TARGET_KIND="${{ inputs.target || 'boot-gate' }}"
          
          "$REPO_DIR/scripts/build-all.sh" \
            "$REPO_DIR" \
            "$BR2_DIR" \
            "$OUT_DIR" \
            "$DIST_DIR" \
            "$SRC_DIR" \
            "$TARGET_KIND"

      # -------------------------------------------------------------------------
      # 5. Verify build outputs
      # -------------------------------------------------------------------------
      - name: Verify build outputs
        run: |
          # For boot-gate
          if [[ "${{ inputs.target || 'boot-gate' }}" == "boot-gate" ]]; then
            [ -f "${{ env.DIST_DIR }}/nrzube-boot-gate.img" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/Image" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/u-boot.bin" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/initrd.img" ] || exit 1
            
            # Verify the boot gate image is a valid GPT disk
            sudo file ${{ env.DIST_DIR }}/nrzube-boot-gate.img
            
          # For full build
          else
            [ -f "${{ env.DIST_DIR }}/nrzube.img" ] || exit 1
            [ -f "${{ env.DIST_DIR }}/release.json" ] || exit 1
            [ -f "${{ env.DIST_DIR }}/SHA256SUMS" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/Image" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/initrd.img" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/u-boot.bin" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/slot-a.squashfs" ] || exit 1
            [ -f "${{ env.OUT_DIR }}/slot-b.squashfs" ] || exit 1
            
            # Verify the full image is a valid GPT disk with 4 partitions
            sudo file ${{ env.DIST_DIR }}/nrzube.img
            
            # Verify SHA256SUMS
            cd ${{ env.DIST_DIR }} && sha256sum -c SHA256SUMS
            
            # Verify release.json is valid JSON
            python3 -m json.tool release.json > /dev/null
          fi
          
          echo "Build verification passed"

      # -------------------------------------------------------------------------
      # 6. Test Rust agent (unit tests)
      # -------------------------------------------------------------------------
      - name: Test Rust agent
        run: |
          cd ${{ env.BUILD_DIR }}/buildroot/output/target
          if [ -f nrzube-agent ]; then
            echo "nrzube-agent binary found, running tests..."
            # Note: Unit tests are typically run during the build (cargo test)
            # This step verifies the binary exists and is executable
            file nrzube-agent
            ./nrzube-agent --version || true
          else
            echo "nrzube-agent binary not found in target"
          fi

      # -------------------------------------------------------------------------
      # 7. Upload artifacts (for debugging)
      # -------------------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrzube-artifacts-${{ inputs.target || 'boot-gate' }}
          path: |
            ${{ env.DIST_DIR }}/
            ${{ env.OUT_DIR }}/
          retention-days: 7
          compression-level: 0

      # -------------------------------------------------------------------------
      # 8. Clean up
      # -------------------------------------------------------------------------
      - name: Clean up
        if: always()
        run: |
          rm -rf ${{ env.BUILD_DIR }}
          rm -rf ${{ env.OUT_DIR }}
