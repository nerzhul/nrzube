# =============================================================================
# nrzube — Dependabot Configuration
#
# Automatically updates:
#   - GitHub Actions workflows
#   - Dockerfiles (future)
#   - Rust dependencies (Cargo.toml)
#
# Note: Buildroot, kernel, and other system-level dependencies are managed
# by Renovate (renovate.json) for more complex version pinning.
# =============================================================================

version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "nerzhul"

  # Rust (Cargo)
  - package-ecosystem: "cargo"
    directory: "/agent"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "nerzhul"

  # Rust (workspace root)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "nerzhul"
