# --- URL templates ------------------------------------------------------------
# The "@VERSION@" placeholder is replaced by the version of the component.
# The URLs are derived (never hardcoded) so that a version bump can not leave
# a stale URL behind. Both the make and the shell build scripts use them.

BUILDROOT_URL_TEMPLATE=https://buildroot.org/downloads/buildroot-@VERSION@.tar.gz
FIRMWARE_URL_TEMPLATE=https://github.com/raspberrypi/firmware/archive/refs/tags/@VERSION@.tar.gz
UBOOT_URL_TEMPLATE=https://github.com/u-boot/u-boot/archive/refs/tags/@VERSION@.tar.gz
CONTAINERD_URL_TEMPLATE=https://github.com/containerd/containerd/releases/download/v@VERSION@/containerd-static-@VERSION@-linux-arm64.tar.gz
RUNC_URL_TEMPLATE=https://github.com/opencontainers/runc/releases/download/v@VERSION@/runc.arm64
KUBERNETES_URL_TEMPLATE=https://dl.k8s.io/release/v@VERSION@/bin/linux/arm64
CNI_URL_TEMPLATE=https://github.com/containernetworking/plugins/releases/download/v@VERSION@/cni-plugins-linux-arm64-v@VERSION@.tgz
COSIGN_URL_TEMPLATE=https://github.com/sigstore/cosign/releases/download/v@VERSION@/cosign-linux-arm64
DHCPCD_URL_TEMPLATE=https://github.com/NetworkConfiguration/dhcpcd/releases/download/v@VERSION@/dhcpcd-@VERSION@.tar.xz
