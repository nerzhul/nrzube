# nrzube — pinned versions (single source of truth)
#
# Format: KEY=VALUE, one entry per component.
# "# renovate: ..." lines are annotations read by Renovate (see renovate.json):
# they carry the datasource and the upstream repository.
#
# Rules:
#  - no implicit version: everything downloaded is listed here;
#  - git sources are pinned by COMMIT (never by branch);
#  - binary artifacts are pinned by SHA-256;
#  - URLs are *derived* from the versions (see versions.mk) so that a
#    Renovate version bump can never leave a stale URL behind.
#
# `make versions-lock` re-resolves the COMMITs from the TAGs (GitHub API) and
# recomputes the SHA-256 of the release artifacts.

# --- Buildroot (build system, not a distro) ---------------------------------
# renovate: datasource=github-tags depName=buildroot/buildroot versioning=loose
BUILDROOT_VERSION=2026.08.1
BUILDROOT_COMMIT=7fdeadb3b9f12f78e5fccca914d7fef47090ab9a
BUILDROOT_SHA256=38a6c152490096018720a9ade379ee1e571c9bf5f93a3657a166566945a98b0d

# --- Kernel (raspberrypi/linux, rpi-6.18.y branch frozen on a tag) ----------
