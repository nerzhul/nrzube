# =============================================================================
# nrzube — chrony base configuration (plan §5.7).
#
# The NTP sources are DYNAMIC: .sources files under /run/chrony (tmpfs),
# written by the dhcpcd hook 60-nrzube-ntp (DHCP option 42) and by the agent
# (ntpServers of the persisted node config). /etc is an overlay: this file is
# the immutable lower layer and is never written at runtime.
# =============================================================================

# Dynamic sources (DHCP option 42 + node config).
sourcedir /run/chrony

# The Pi 5 has no battery-backed RTC: after a power cut the clock is wrong and
# the kubelet TLS to the API server fails. Step the clock at startup, even for
# large offsets (-1 = unlimited steps at boot).
makestep 1.0 -1

# Drift file in /run (tmpfs): losing it on reboot is harmless.
driftfile /run/chrony/drift

# Write the RTC when one is present (add-on); harmless without one.
rtcsync

# Command channel for chronyc (used by the time-sync service): local only.
bindcmdaddress 127.0.0.1
unixsockdir /run/chrony

# The node is an NTP client only: it serves no client (no "allow" directive).
