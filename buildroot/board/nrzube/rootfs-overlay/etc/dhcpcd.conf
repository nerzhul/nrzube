# =============================================================================
# nrzube — dhcpcd configuration.
#
# dhcpcd is the single DHCP client of the node: DHCPv4, DHCPv6, RA/SLAAC
# (user space) and /etc/resolv.conf (including RDNSS).
# =============================================================================

# --- Node configuration URL (DHCP vendor option 224) ------------------------
# dhcpcd ships a built-in definition for option 224:
#     define 224 binhex site_specific_224
# Redefining it as a "string" replaces that entry (the parser overwrites an
# existing definition with the same option code), so the value is readable
# instead of hex encoded. The variable is exported to the hooks as
# new_nrzube_config_url.
define 224 string nrzube_config_url
option nrzube_config_url

# --- SLAAC -------------------------------------------------------------------
# "private" generates a RFC 7217 address: stable across reboots, which keeps
# the node's IPv6 usable for Kubernetes. The RFC 4941 temporary addresses are
# NOT requested (no "temporary" keyword): they rotate and would change the
# node's IP. The node IP is in any case pinned explicitly (kubelet --node-ip).
slaac private

# --- Lease behaviour ---------------------------------------------------------
# Keep the last lease when the DHCP server is momentarily unreachable: the node
# keeps its address instead of losing it (the MAC reservation on the router
# side remains the real fix).
lastlease

# --- Resolver ----------------------------------------------------------------
# dhcpcd writes /etc/resolv.conf from the DHCP/RDNSS options. /etc is an
# overlay (upper in p4): the file survives reboots.
